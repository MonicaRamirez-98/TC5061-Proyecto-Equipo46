# TC5061 · MiBici Equipo 46 · Entregable 7 · Orquestación de servicios
# PRECONDICIÓN: exportar el modelo champion real a models/compose-champion/
# Ver docs/Semana10_Axel_Guia_Paso_a_Paso.md. No se versionan artefactos del modelo.
name: mibici-equipo46

x-common-build: &common-build
  context: .
  dockerfile: Containerfile

x-common-environment: &common-environment
  MLFLOW_TRACKING_URI: http://mlflow:5000
  MLFLOW_REGISTRY_URI: http://mlflow:5000
  MIBICI_MODEL_NAME: mibici-equipo46-p1-demanda
  MIBICI_MODEL_ALIAS: champion
  PYTHONUNBUFFERED: "1"

services:
  mlflow:
    build: *common-build
    image: mibici-equipo46:semana10
    command:
      - mlflow
      - server
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
      - --artifacts-destination
      - /mlflow/artifacts
      - --serve-artifacts
      - --host
      - 0.0.0.0
      - --port
      - "5000"
      - --workers
      - "1"
      - --allowed-hosts
      - mlflow:5000,localhost:5000,127.0.0.1:5000
    ports:
      - "127.0.0.1:${MLFLOW_PORT:-5000}:5000"
    volumes:
      - mlflow_data:/mlflow
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=5).read()"]
      interval: 10s
      timeout: 6s
      retries: 18
      start_period: 50s

  model-init:
    build: *common-build
    image: mibici-equipo46:semana10
    command: ["python", "-m", "ops.seed_registry"]
    environment: *common-environment
    volumes:
      - ./models/compose-champion:/model-export:ro
    depends_on:
      mlflow:
        condition: service_healthy
    networks:
      - backend
    restart: "no"

  api:
    build: *common-build
    image: mibici-equipo46:semana10
    # CMD original de Containerfile: uvicorn api.main:app
    environment: *common-environment
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      model-init:
        condition: service_completed_successfully
    networks:
      - backend
    restart: unless-stopped
    healthcheck:
      # /health devuelve 503 si la API existe pero el champion no se pudo cargar.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5).read()"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 35s

networks:
  backend:
    driver: bridge

volumes:
  mlflow_data:
    # La BD SQLite y los artefactos quedan persistentes aunque se apaguen servicios.
