name: TC5061 | Semana 10 | Pytest + Docker + Compose

on:
  push:
    branches: [main, "feature/**", "fix/**"]
  pull_request:
  workflow_dispatch:

# CI funciona sin secretos. La publicación al registro es opcional.
permissions:
  contents: read

concurrency:
  group: semana10-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit_tests:
    name: "1 | Pruebas del proyecto"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11 y caché de pip
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-service.txt
            requirements-ci.txt
            requirements-week9.txt

      - name: Instalar dependencias del proyecto y pruebas
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-service.txt -r requirements-ci.txt -r requirements-week9.txt
          python -m pip install -e .

      - name: Ejecutar suite completa con Pytest
        run: python -m pytest tests/ -q --junitxml=pytest-results.xml

      - name: Conservar resultados JUnit (también si hay fallas)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semana10-pytest-junit
          path: pytest-results.xml
          if-no-files-found: warn

  build_and_smoke:
    name: "2 | Imagen OCI + Compose + inferencia smoke"
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: unit_tests
    steps:
      - name: Obtener código
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir imagen con caché (sin publicar)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Containerfile
          push: false
          load: true
          tags: mibici-equipo46:semana10
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # IMPORTANTE: nunca se coloca el modelo real dentro del repositorio.
      # La simulación aquí verifica el cableado, NO las métricas del modelo.
      - name: Crear modelo sintético SOLO para smoke de CI
        shell: bash
        run: |
          mkdir -p models/compose-champion
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp \
            -v "${{ github.workspace }}/models/compose-champion:/model-export" \
            mibici-equipo46:semana10 \
            python -m ops.ci_model --output /model-export

      - name: Validar sintaxis y dependencias de Compose
        run: docker compose -f docker-compose.yml config --quiet

      - name: Levantar servicios SIN volver a construir
        run: docker compose -f docker-compose.yml up -d --no-build

      - name: Esperar readiness REAL de API (requiere MLflow y modelo)
        shell: bash
        run: |
          for i in $(seq 1 48); do
            if curl --fail --silent http://localhost:8000/health >/dev/null; then
              echo "API saludable tras $i comprobaciones."
              exit 0
            fi
            sleep 5
          done
          docker compose -f docker-compose.yml ps --all
          exit 1

      - name: Probar /health, /model-info y /predict
        run: python -m ops.smoke_test --url http://localhost:8000

      - name: Estado final de servicios
        run: docker compose -f docker-compose.yml ps --all

      - name: Guardar logs (evidencia y diagnóstico)
        if: always()
        shell: bash
        run: docker compose -f docker-compose.yml logs --no-color > semana10-compose-logs.txt 2>&1 || true

      - name: Subir logs de Docker Compose
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semana10-compose-logs
          path: semana10-compose-logs.txt
          if-no-files-found: warn

      - name: Apagar servicios efímeros de CI
        if: always()
        run: docker compose -f docker-compose.yml down -v --remove-orphans

  publish_optional:
    name: "3 | CD opcional al GitHub Container Registry"
    # Se activa solo si el repositorio establece la variable PUBLISH_GHCR=true.
    # Los pull requests NO publican imágenes.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PUBLISH_GHCR == 'true'
    needs: [unit_tests, build_and_smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Preparar nombre del paquete GHCR (minúsculas)
        shell: bash
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:latest" >> "$GITHUB_ENV"
      - name: Iniciar sesión en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Habilitar Buildx
        uses: docker/setup-buildx-action@v3
      - name: Publicar imagen verificada
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Containerfile
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
